name: scopify_mobile
description: "Scopify's Flutter mobile client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: 3.3.2
  go_router: ^17.4.0
  riverpod_annotation: 4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  go_router_builder: ^4.4.0
  riverpod_generator: 4.0.4

flutter:
  uses-material-design: true
